version: '3.8'

services:
  # Next.js client application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_FILE_SERVER_URL=http://localhost:8000
    depends_on:
      - aspnet-api
      - express-api
    networks:
      - penguin-network
    restart: unless-stopped

  # ASP.NET API
  aspnet-api:
    build:
      context: ./server/AspNet
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=PenguinDB;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
    depends_on:
      - db
    networks:
      - penguin-network
    restart: unless-stopped

  # Express.js file server
  express-api:
    build:
      context: ./server/expressjs_sv
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - file-uploads:/app/uploads
    networks:
      - penguin-network
    restart: unless-stopped

  # SQL Server database
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - penguin-network
    restart: unless-stopped

volumes:
  mssql-data:
  file-uploads:

networks:
  penguin-network:
    driver: bridge